<section class="technology-atlas-page">
  @if (cacheLoading()) {<p role="status">Loading technologies…</p>}
  @if (cacheError()) {<p role="alert">{{ cacheError() }}</p>}
  <div class="filters"><app-technology-filters [filter]="filter()" (filterChange)="filter.set($event)"
    [statusFilter]="statusFilter()" (statusFilterChange)="statusFilter.set($event)"/></div>
  <app-technology-tree [graph]="graph()" [filter]="filter()" [statusFilter]="statusFilter()" [researchedIds]="researchedIds()" (selected)="selectedTechnology.set($event)"/>
  @if (error() && sessionCode()) {
    <p role="alert">{{ error() }}</p>
  }
</section>

@if (selectedTechnology(); as technology) {
  <app-technology-popup [technology]="technology" [researchedIds]="researchedIds()" [status]="selectedStatus()"
    (closed)="selectedTechnology.set(null)" (researched)="researchTechnology($event)"/>
}

<app-session-dialog
  title="Technology Atlas session"
  [visible]="dialogVisible()"
  [loading]="loading()"
  [error]="error()"
  [canCancel]="true"
  (create)="createSession()"
  (join)="joinSession($event)"
  (cancel)="closeDialog()"
  (clearError)="error.set('')"
/>
