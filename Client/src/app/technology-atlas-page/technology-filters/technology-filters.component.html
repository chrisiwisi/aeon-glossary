<div class="filter-groups">
  <nav aria-label="Filter technology branches">
    <span class="group-label">Branch</span>
    @for (option of options; track option) {
      <button type="button" [class.active]="filter() === option" [attr.aria-pressed]="filter() === option" (click)="filterChange.emit(option)">
        @if (option === 'Structural') {<span aria-hidden="true">⬡</span>}
        @if (option === 'Combat') {<span aria-hidden="true">✦</span>}
        {{ option }}
      </button>
    }
  </nav>
  <nav aria-label="Filter technology status">
    <span class="group-label">Progress</span>
    @for (option of statusOptions; track option.value) {
      <button type="button" [class.active]="statusFilter() === option.value" [attr.aria-pressed]="statusFilter() === option.value" (click)="statusFilterChange.emit(option.value)">
        {{ option.label }}
      </button>
    }
  </nav>
</div>
