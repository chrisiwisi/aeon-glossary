<div class="two-col-layout">

  <!-- Messages Column -->
  <div class="col">
    <div class="section-header">
      <h2 class="section-title">Messages</h2>
      <button nz-button nzType="primary" nzShape="round" (click)="openMessageModular()">
        <nz-icon nzType="plus" nzTheme="outline" />
        New Message
      </button>
    </div>

    <div class="messages-list">
      @for (message of messages; track $index) {
        <app-message [message]="message" [alphabet]="alphabet" (delete)="deleteMessage($index)" (open)="openMessageModular(message)"/>
      }
      @if (messages.length === 0) {
        <p class="empty-hint">No messages yet. Click "New Message" to get started.</p>
      }
    </div>
  </div>

  <!-- Letters Column -->
  <div class="col">
    <div class="section-header">
      <h2 class="section-title">Letters</h2>
      <div class="header-actions">
        <button nz-button nzType="primary" nzShape="circle" (click)="saveCurrentProgress()" nz-tooltip nzTooltipTitle="Save">
          <nz-icon nzType="save" nzTheme="outline" />
        </button>
      </div>
    </div>

    <div class="letter-container" cdkScrollable cdkDropList (cdkDropListDropped)="drop($event)" cdkDropListOrientation="mixed">
      @for (letter of alphabet; track letter.id) {
        <app-letter (deleteThisLetter)="deleteLetter($event)" [letter]="letter" cdkDrag />
      }
    </div>

    <div class="add-letter-row">
      <button nz-button nzType="dashed" nzShape="round" (click)="addLetter()">
        <nz-icon nzType="plus" nzTheme="outline" />
        Add Letter
      </button>
    </div>
  </div>

</div>
