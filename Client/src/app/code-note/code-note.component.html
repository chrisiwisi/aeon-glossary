<app-session-dialog
  title="Code Note session"
  [visible]="dialogVisible()"
  [loading]="dialogLoading()"
  [error]="dialogError()"
  [canCancel]="!!lobbyCode()"
  (create)="createSession()"
  (join)="joinSession($event)"
  (cancel)="closeDialog()"
  (clearError)="dialogError.set('')"
/>

<div class="two-col-layout">

  <!-- Messages Column -->
  <div class="col">
    <div class="section-header">
      <h2 class="section-title">Messages</h2>
      <button nz-button nzType="primary" nzShape="round" (click)="openMessageModular()">
        <nz-icon nzType="plus" nzTheme="outline" />
        New Message
      </button>
    </div>

    <div class="messages-list">
      @for (message of messages; track $index) {
        <app-message [message]="message" [alphabet]="alphabet" (delete)="deleteMessage($index)" (open)="openMessageModular(message, $index)"/>
      }
      @if (messages.length === 0) {
        <p class="empty-hint">No messages yet. Click "New Message" to get started.</p>
      }
    </div>
  </div>

  <!-- Letters Column -->
  <div class="col">
    <div class="section-header">
      <h2 class="section-title">Letters</h2>
      <div class="header-actions">
        <button nz-button nzType="primary" nzShape="round" (click)="addLetter()">
          <nz-icon nzType="plus" nzTheme="outline" />
          New Letter
        </button>
      </div>
    </div>

    <div class="letter-container" cdkScrollable cdkDropList (cdkDropListDropped)="drop($event)" cdkDropListOrientation="mixed">
      @for (letter of alphabet; track letter.id) {
        <app-letter (deleteThisLetter)="deleteLetter($event)" (letterChanged)="onLetterChanged()" [letter]="letter" cdkDrag />
      }
      @if (alphabet.length === 0) {
        <p class="empty-hint">No letters yet. Click "New Letter" to get started.</p>
      }
    </div>
  </div>

</div>
