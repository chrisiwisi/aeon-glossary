<div class="message-wrapper">
  <!-- Letter tiles -->
  <div class="letters-area">
    @for (result of message() | decode: alphabet(); track $index) {
      <div class="letter-wrapper">
        @if (isDecoded && result.letter) {
          <span class="decoded-letter">{{ result.letter }}</span>
        } @else if (result.URL) {
          <img [src]="result.URL" alt="unknown letter">
        }
      </div>
    }
  </div>

  <!-- Controls -->
  <div class="controls">
    <nz-switch
      [(ngModel)]="isDecoded"
      nzSize="small"
      nz-tooltip
      nzTooltipTitle="Toggle decode"
    />

    @if (showEdit()) {
      <button
        nz-button
        nzType="text"
        nzShape="circle"
        nz-tooltip
        nzTooltipTitle="Edit message"
        (click)="openDialog()"
      >
        <nz-icon nzType="edit" nzTheme="outline" />
      </button>
    }

    @if (showDelete()) {
      <button
        nz-button
        nzType="text"
        nzShape="circle"
        nz-tooltip
        nzTooltipTitle="Delete message"
        class="delete-btn"
        (click)="deleteMessage()"
      >
        <nz-icon nzType="delete" nzTheme="outline" />
      </button>
    }
  </div>
</div>
