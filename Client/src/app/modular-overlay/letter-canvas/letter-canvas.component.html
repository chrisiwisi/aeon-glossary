<div class="overlay-content">
  <div class="toolbar">
    <button nz-button nzType="default" nzShape="circle" (click)="undoCanvas()" nz-tooltip nzTooltipTitle="Undo">
      <nz-icon nzType="undo" nzTheme="outline" />
    </button>

    <button nz-button nzType="default" nzShape="circle" (click)="resetCanvas()" nz-tooltip nzTooltipTitle="Clear">
      <nz-icon nzType="clear" nzTheme="outline" />
    </button>

    <button nz-button nzType="default" nzShape="circle" (click)="fileInput.click()" nz-tooltip nzTooltipTitle="Import image (or paste)">
      <nz-icon nzType="upload" nzTheme="outline" />
    </button>

    <button nz-button nzType="default" nzShape="circle" nzDanger (click)="deleteCanvas()" nz-tooltip nzTooltipTitle="Delete letter">
      <nz-icon nzType="close" nzTheme="outline" />
    </button>
  </div>

  @if (showThresholdSlider) {
    <div class="threshold-row">
      <span class="threshold-label">Threshold</span>
      <input type="range" min="20" max="230" [(ngModel)]="threshold" class="threshold-slider" />
      <span class="threshold-value">{{ threshold }}</span>
      <button nz-button nzType="primary" nzSize="small" (click)="applyThreshold()">Apply</button>
    </div>
  }

  <canvas id="letter-drawing-canvas" width="300" height="400" #canvas (paste)="onPaste($event)"></canvas>

  <input #fileInput type="file" accept="image/*" style="display:none" (change)="onFileSelected($event)" />
</div>
